# 보기 전용 데스크를 정적 사이트로 구워 Cloudflare Pages에 올린다 (PC가 꺼져 있어도 열리게).
# 언제 도나: 결과가 푸시될 때(publish.bat), 매일 아침 7시·오후 4시(KST, 시세 갱신), 수동 실행.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SITE_KEY(주소 경로)
name: publish-site

on:
  push:
    branches: [main]
    paths: ["outputs/**", "log.csv", "final_log.csv", "data/**", "config.yaml", "app/**", "tools/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "0 22 * * *"      # 07:00 KST — 미국장 마감 반영
    - cron: "0 7 * * 1-5"     # 16:00 KST — 한국장 마감 반영
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-app.txt
      - name: 사이트 굽기
        run: python tools/export_static.py --out site
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
          TZ: Asia/Seoul
      # 붙여넣은 값에 공백·줄바꿈·"Bearer "·curl 명령 조각이 섞여 들어오는 일이 잦다.
      # 토큰(영숫자·-·_ 30자 이상)과 계정 ID(16진 32자)만 뽑아 쓰고, 뽑은 값도 로그에서 가린다.
      - name: Cloudflare 값 정리
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(printf '%s' "$RAW_TOKEN" | sed 's/Bearer//g' | grep -oE '[A-Za-z0-9_-]{30,}' | head -1)
          A=$(printf '%s' "$RAW_ACCOUNT" | grep -oiE '[0-9a-f]{32}' | head -1)
          [ -n "$T" ] || { echo "CLOUDFLARE_API_TOKEN에서 토큰을 찾지 못했다"; exit 1; }
          [ -n "$A" ] || { echo "CLOUDFLARE_ACCOUNT_ID에서 32자리 계정 ID를 찾지 못했다"; exit 1; }
          echo "::add-mask::$T"; echo "::add-mask::$A"
          echo "CF_TOKEN=$T" >> "$GITHUB_ENV"; echo "CF_ACCOUNT=$A" >> "$GITHUB_ENV"
          echo "토큰 ${#T}자, 계정 ID ${#A}자"
      - name: Pages 프로젝트 만들기 (처음 한 번, 이미 있으면 넘어감)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: "4"
          command: pages project create weekly-pick-desk --production-branch=main
      - name: 게시
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: "4"
          command: pages deploy site --project-name=weekly-pick-desk --branch=main --commit-dirty=true
