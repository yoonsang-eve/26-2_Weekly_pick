<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk 목업 C · 평면도 일러스트</title>
<style>
  :root { --bg:#fbf7f0; --ink:#2a2622; --ink2:#7a7166; --line:#e7dfd2; }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,"Segoe UI","Malgun Gothic",sans-serif; }
  header { padding:16px 24px 0 } h1 { margin:0; font-size:16px } header p { margin:2px 0 0; color:var(--ink2); font-size:12.5px }
  .wrap { display:grid; grid-template-columns: 1fr 320px; gap:16px; padding:12px 24px 24px }
  svg { width:100%; height:auto; display:block; background:#fff; border:1px solid var(--line); border-radius:18px }
  .panel { background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px }
  .panel h2 { font-size:13px; margin:0 0 8px; color:var(--ink2) }
  .card { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px }
  .card b { font-size:14px } .card p { margin:4px 0 0; font-size:12.5px; color:var(--ink2) }
  .pill { font-size:11px; padding:1px 8px; border-radius:99px; background:#ffe9c7; color:#8a5a00; margin-left:6px }
  @keyframes walk { 0% { offset-distance:0% } 100% { offset-distance:100% } }
  .doc { offset-path: path("M150 150 L 380 150 L 620 150 L 620 330 L 150 330 L 150 460 L 380 460"); animation: walk 9s linear infinite; }
  text { font-family: system-ui,"Malgun Gothic",sans-serif }
</style></head><body>
<header><h1>C · 평면도 일러스트</h1><p>위에서 내려다본 플랫한 사무실. 서류(종목 봉투)가 방에서 방으로 이동하며 20 → 3 → 1로 줄어든다</p></header>
<div class="wrap">
<svg viewBox="0 0 780 560">
  <defs>
    <pattern id="wood" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#f6ecdd"/><path d="M0 12H24" stroke="#efe2cc"/></pattern>
    <pattern id="tile" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#eef4f6"/><path d="M0 0H20V20" fill="none" stroke="#e1eaee"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".12"/></filter>
  </defs>
  <!-- 복도 -->
  <rect x="20" y="20" width="740" height="520" rx="22" fill="#f1ebe1"/>
  <!-- 방: 위 줄 -->
  <g>
    <rect x="40" y="40" width="220" height="210" rx="16" fill="url(#tile)" stroke="#d9e3e8" stroke-width="2"/>
    <rect x="280" y="40" width="200" height="210" rx="16" fill="url(#wood)" stroke="#eadcc4" stroke-width="2"/>
    <rect x="500" y="40" width="240" height="210" rx="16" fill="#fdeee6" stroke="#f3d9cb" stroke-width="2"/>
    <rect x="40" y="370" width="220" height="150" rx="16" fill="#f1ecfa" stroke="#e1d8f3" stroke-width="2"/>
    <rect x="280" y="370" width="200" height="150" rx="16" fill="#eef5ee" stroke="#d8e8d8" stroke-width="2"/>
    <rect x="500" y="370" width="240" height="150" rx="16" fill="#f4f4f4" stroke="#e4e4e4" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#2a2622">
    <text x="56" y="66">① 스크리닝실</text><text x="296" y="66">② Analyst 서재</text><text x="516" y="66">③ 토론실</text>
    <text x="56" y="396">④ Trader 실</text><text x="296" y="396">⑤ 복기실</text><text x="516" y="396" fill="#9a9a9a">⑥ 주문 데스크 (예정)</text>
  </g>
  <!-- ① 스크리닝: 서버랙 + 깔때기 -->
  <g filter="url(#sh)"><rect x="60" y="90" width="36" height="120" rx="6" fill="#43506a"/><rect x="104" y="90" width="36" height="120" rx="6" fill="#43506a"/></g>
  <g fill="#7fe0a8"><circle cx="70" cy="104" r="3"/><circle cx="70" cy="120" r="3"/><circle cx="114" cy="104" r="3"/><circle cx="114" cy="136" r="3"/></g>
  <path d="M170 110 h70 l-26 40 v40 h-18 v-40z" fill="#fff" stroke="#b9c7cf" stroke-width="2"/>
  <text x="205" y="104" text-anchor="middle" font-size="11" fill="#7a7166">2,641</text><text x="205" y="206" text-anchor="middle" font-size="12" font-weight="700">20</text>
  <!-- ② Analyst: 책상 + 캐릭터 -->
  <g filter="url(#sh)"><rect x="320" y="120" width="120" height="56" rx="10" fill="#caa47a"/></g>
  <rect x="352" y="128" width="56" height="10" rx="3" fill="#3b3f4a"/>
  <g><circle cx="380" cy="200" r="20" fill="#3aa36b"/><circle cx="380" cy="194" r="11" fill="#f5d6b8"/></g>
  <g><rect x="398" y="206" width="54" height="22" rx="11" fill="#2a2622"/><text x="425" y="221" text-anchor="middle" font-size="11" fill="#fff">✓ 20→3</text></g>
  <!-- ③ 토론실: 원탁 + Bull/Bear -->
  <g filter="url(#sh)"><ellipse cx="620" cy="150" rx="70" ry="44" fill="#e9c9a8"/></g>
  <g><circle cx="530" cy="150" r="20" fill="#2f7fe0"/><circle cx="530" cy="144" r="11" fill="#f5d6b8"/><text x="530" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#2f7fe0">Bull</text></g>
  <g><circle cx="710" cy="150" r="20" fill="#e2573b"/><circle cx="710" cy="144" r="11" fill="#f5d6b8"/><text x="710" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#e2573b">Bear</text></g>
  <g><rect x="600" y="84" width="140" height="28" rx="14" fill="#fff" stroke="#e2573b" stroke-width="1.5"/><text x="670" y="102" text-anchor="middle" font-size="11.5">"CB 오버행 확인됨"</text></g>
  <g font-size="10" fill="#7a7166"><rect x="592" y="138" width="22" height="28" rx="3" fill="#fff" stroke="#d6c2a8"/><rect x="620" y="138" width="22" height="28" rx="3" fill="#fff" stroke="#d6c2a8"/><rect x="648" y="138" width="22" height="28" rx="3" fill="#fff" stroke="#d6c2a8"/></g>
  <!-- ④ Trader -->
  <g filter="url(#sh)"><rect x="80" y="420" width="140" height="50" rx="10" fill="#b99bd6"/></g>
  <g><circle cx="150" cy="490" r="18" fill="#7a4cc2" opacity=".35"/><circle cx="150" cy="485" r="10" fill="#f5d6b8" opacity=".6"/></g>
  <text x="150" y="450" text-anchor="middle" font-size="11" fill="#fff">대기</text>
  <!-- ⑤ 복기실: 차트 보드 -->
  <g filter="url(#sh)"><rect x="310" y="416" width="140" height="70" rx="8" fill="#fff" stroke="#cfe0cf"/></g>
  <polyline points="320,470 345,460 365,466 390,440 415,448 440,426" fill="none" stroke="#2f9e5b" stroke-width="2.5"/>
  <text x="380" y="506" text-anchor="middle" font-size="11" fill="#7a7166">wk3 −5.1% · wk4 +18.7%</text>
  <!-- ⑥ 주문 -->
  <text x="620" y="455" text-anchor="middle" font-size="12" fill="#a0a0a0">KIS 연결 전</text>
  <!-- 문 -->
  <g fill="#f1ebe1"><rect x="258" y="130" width="24" height="36"/><rect x="478" y="130" width="24" height="36"/><rect x="130" y="248" width="40" height="24"/><rect x="600" y="248" width="40" height="24"/><rect x="130" y="368" width="40" height="4"/><rect x="258" y="440" width="24" height="36"/></g>
  <!-- 이동 경로 + 서류 -->
  <path d="M150 150 L 380 150 L 620 150 L 620 330 L 150 330 L 150 460 L 380 460" fill="none" stroke="#c9b89c" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity=".0"/>
  <path d="M170 310 H 610" stroke="#d9cdb8" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g class="doc"><rect x="-13" y="-10" width="26" height="20" rx="3" fill="#fff" stroke="#e0a44a" stroke-width="2"/><path d="M-13 -8 L0 2 L13 -8" fill="none" stroke="#e0a44a" stroke-width="1.5"/></g>
</svg>
<div class="panel">
  <h2>wk4 · KR 진행</h2>
  <div class="card"><b>① Screener</b><p>2,641 → 20종목 · 22:01</p></div>
  <div class="card"><b>② Analyst</b><p>검색 24회 · 20 → 3 · 273초</p></div>
  <div class="card" style="border-color:#e2573b"><b>③ Bull · Bear</b><span class="pill">토론 중</span><p>Bull 완료 · Bear가 저스템 CB 오버행, 예스티 특허소송 확인</p></div>
  <div class="card" style="opacity:.55"><b>④ Trader</b><p>Bear 응답 대기</p></div>
  <div class="card" style="opacity:.55"><b>⑤ 복기</b><p>금요일 장 마감 후 정산</p></div>
</div>
</div>
</body></html>
