<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#f5f3ef; --bg1:#ffffff; --room:#ffffff; --room2:#fcfbf9; --line:rgba(60,50,40,.08); --line2:rgba(60,50,40,.12);
  --ink:#1c1917; --ink2:#57534e; --dim:#a8a29e;
  --c-scr:#0d9488; --c-ana:#16a34a; --c-bull:#2563eb; --c-bear:#e11d48; --c-trd:#7c3aed; --c-set:#d97706; --c-ord:#a8a29e;
  --mono:"JetBrains Mono",Consolas,monospace; --sans:"IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;color:var(--ink);font:14px/1.5 var(--sans);background:
  radial-gradient(900px 500px at 15% -10%,rgba(253,230,200,.55),transparent 60%),
  radial-gradient(800px 500px at 110% 110%,rgba(221,214,254,.45),transparent 60%),var(--bg0);}
.app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;height:100vh}
@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}}

/* top bar */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--c-bull),var(--c-trd));box-shadow:0 4px 12px rgba(37,99,235,.3)}
.chip{font:500 12px var(--mono);color:var(--ink2);padding:5px 10px;border:1px solid var(--line2);border-radius:99px;background:#fff}
.chip b{color:var(--ink)} .grow{flex:1}
.live{display:inline-flex;align-items:center;gap:7px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);animation:pulse 1.6s infinite}
.btn{font:600 12.5px var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:6px 12px;cursor:pointer}
.btn:hover{background:#faf8f5}

/* floor */
.floor{position:relative;padding:22px;overflow:hidden}
.floor::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;mask:radial-gradient(ellipse at center,#000 40%,transparent 85%);opacity:.7;pointer-events:none}
.rooms{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:34px 30px;height:100%;min-height:600px}
@media(max-width:1000px){.rooms{grid-template-columns:1fr 1fr}}
.room{--c:var(--ink2);position:relative;border-radius:20px;background:linear-gradient(180deg,var(--room),var(--room2));border:1px solid var(--line2);
  box-shadow:0 1px 2px rgba(28,25,23,.04),0 12px 32px -12px rgba(28,25,23,.12);display:flex;flex-direction:column;overflow:hidden;transition:border-color .4s,box-shadow .4s,opacity .4s}
.room.work{border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 14px 36px -10px color-mix(in srgb,var(--c) 35%,transparent)}
.room.idle>*{opacity:.6} .room.locked>*{opacity:.45} .room.locked{border-style:dashed}
.rh{display:flex;align-items:center;gap:9px;padding:12px 14px 0}
.num{font:700 11px var(--mono);width:22px;height:22px;display:grid;place-items:center;border-radius:7px;color:#fff;background:var(--c)}
.rh b{font-weight:600;font-size:14px} .rh small{color:var(--dim);font-size:12px}
.pill{margin-left:auto;font:600 11px var(--sans);padding:3px 9px;border-radius:99px;background:#f5f5f4;color:var(--ink2)}
.work .pill{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.done .pill{background:#dcfce7;color:#15803d}
.scene{flex:1;min-height:120px;position:relative;margin:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 6%,#fff);background-image:linear-gradient(color-mix(in srgb,var(--c) 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--c) 7%,transparent) 1px,transparent 1px);background-size:22px 22px}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.term{margin:0 12px 12px;border-radius:12px;background:#fafaf9;border:1px solid var(--line2);padding:9px 11px;font:12px/1.55 var(--mono);color:var(--ink2);height:80px;overflow:hidden;position:relative}
.term::after{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:linear-gradient(#fafaf9,transparent);pointer-events:none}
.term .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .ok{color:#15803d}.term .no{color:#be123c}.term .hi{color:var(--c)}.term .mu{color:var(--dim)}
.caret::after{content:"▍";color:var(--c);animation:blink 1s steps(2) infinite}

/* corridor + envelope */
#corr{position:absolute;inset:0;pointer-events:none;overflow:visible}
.env{position:absolute;width:44px;height:32px;margin:-16px 0 0 -22px;z-index:5;transition:left 1.1s cubic-bezier(.6,0,.3,1),top 1.1s cubic-bezier(.6,0,.3,1);filter:drop-shadow(0 6px 10px rgba(120,80,20,.25))}
.env span{position:absolute;right:-8px;top:-10px;font:700 11px var(--mono);background:var(--ink);color:#fff;border-radius:99px;padding:1px 7px}

/* side */
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.72);backdrop-filter:blur(6px)}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 12px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.steps{display:grid;gap:8px}
.st{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.st i{width:10px;height:10px;border-radius:50%;border:2px solid var(--dim);justify-self:center}
.st.done i{background:#22c55e;border-color:#22c55e}
.st.work i{border-color:var(--c);background:var(--c);box-shadow:0 0 10px var(--c);animation:pulse 1.2s infinite}
.st.work{color:var(--ink)} .st em{font:12px var(--mono);font-style:normal;color:var(--dim)}
.log{flex:1;overflow:auto;padding:14px 18px;font:12px/1.7 var(--mono);color:var(--ink2);min-height:180px}
.log div{animation:fadein .35s ease} .log t{color:var(--dim);margin-right:8px}
.pick{margin:0 18px 18px;border-radius:16px;padding:14px 16px;border:1px solid var(--line2);background:linear-gradient(135deg,#f5f3ff,#eff6ff);opacity:.4;box-shadow:0 10px 30px -12px rgba(124,58,237,.25);transition:opacity .5s}
.pick.on{opacity:1}
.pick .t{font:600 11px var(--mono);color:var(--c-trd);letter-spacing:.1em}
.pick .n{font-size:20px;font-weight:700;margin:4px 0 2px}
.pick .r{font:500 12.5px var(--mono);color:var(--ink2)}

@keyframes pulse{50%{opacity:.35}} @keyframes blink{50%{opacity:0}} @keyframes fadein{from{opacity:0;transform:translateY(4px)}}
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.work .avatar{animation:type .5s ease-in-out infinite}
.work .screen-glow{animation:glow 1.4s ease-in-out infinite}
.led{animation:led 1.2s infinite}
.bubble{opacity:0;transition:opacity .4s}.bubble.on{opacity:1}
</style></head><body>
<div class="app">
  <div class="bar">
    <div class="logo"><i></i>Day Desk</div>
    <span class="chip">WEEK <b>4</b></span><span class="chip">KR · <b>KOSPI/KOSDAQ</b></span><span class="chip">PROMPT <b>v2</b></span>
    <span class="chip live">재생 · wk4 기록</span>
    <div class="grow"></div>
    <button class="btn" id="replay">↻ 처음부터</button>
  </div>

  <div class="floor">
    <div class="rooms" id="rooms"></div>
    <svg id="corr"></svg>
    <div class="env" id="env"><svg viewBox="0 0 44 32"><rect x="1" y="1" width="42" height="30" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><path d="M2 3 L22 18 L42 3" fill="none" stroke="#d97706" stroke-width="2"/></svg><span id="envn">20</span></div>
  </div>

  <aside class="side">
    <div class="sec"><h3>Pipeline</h3><div class="steps" id="steps"></div></div>
    <div class="log" id="log"></div>
    <div class="pick" id="pick"><div class="t">FINAL PICK</div><div class="n">티에스이 <span style="font-size:13px;color:var(--dim)">131290</span></div><div class="r">예측 −5% ~ +10% · catalyst 9/21 관세청 수출입 동향</div></div>
  </aside>
</div>

<script>
/* ---------- 가구·캐릭터 SVG ---------- */
const skin="#f4d3b5";
function person(x,y,c,hair="#2b2240",flip=false){
  const s=flip?-1:1;
  return `<g transform="translate(${x} ${y}) scale(${s} 1)"><g class="avatar">
    <ellipse cx="0" cy="30" rx="20" ry="6" fill="rgba(28,25,23,.12)"/>
    <rect x="-17" y="0" width="34" height="30" rx="14" fill="${c}"/>
    <rect x="-17" y="0" width="34" height="30" rx="14" fill="url(#shade)"/>
    <circle cx="0" cy="-10" r="12" fill="${skin}"/>
    <path d="M-12 -12 a12 12 0 0 1 24 0 q-6 -4 -12 -3 q-7 0 -12 3z" fill="${hair}"/>
  </g></g>`;
}
function desk(x,y,c,w=110){
  return `<g transform="translate(${x} ${y})">
    <ellipse class="screen-glow" cx="0" cy="8" rx="${w*.55}" ry="26" fill="${c}" opacity=".22" filter="url(#blur)"/>
    <rect x="${-w/2}" y="0" width="${w}" height="30" rx="8" fill="#e7d5bb" stroke="#d6c0a0"/>
    <rect x="-26" y="-22" width="52" height="30" rx="4" fill="#0a0f1e" stroke="#2b3656"/>
    <rect class="screen-glow" x="-23" y="-19" width="46" height="24" rx="2" fill="${c}" opacity=".85"/>
    <g opacity=".55" fill="#0a0f1e"><rect x="-19" y="-15" width="26" height="2.5" rx="1"/><rect x="-19" y="-10" width="34" height="2.5" rx="1"/><rect x="-19" y="-5" width="20" height="2.5" rx="1"/></g>
    <rect x="-4" y="8" width="8" height="5" fill="#0a0f1e"/>
    <rect x="${w/2-26}" y="10" width="16" height="11" rx="2" fill="#fff" stroke="#d6d3d1" opacity=".95"/>
  </g>`;
}
const plant=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-8" y="0" width="16" height="14" rx="4" fill="#3b2f2a"/><circle cx="-5" cy="-4" r="7" fill="#2f855a"/><circle cx="5" cy="-6" r="8" fill="#38a169"/><circle cx="0" cy="-12" r="6" fill="#48bb78"/></g>`;
const defs=`<defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="8"/></filter></defs>`;

const SC={
  scr:(c)=>`${[0,1,2].map(i=>`<g transform="translate(${38+i*30} 18)"><rect width="24" height="78" rx="5" fill="#fff" stroke="#d6d3d1"/>${[0,1,2,3,4].map(j=>`<rect x="5" y="${8+j*14}" width="14" height="3" rx="1.5" fill="#e7e5e4"/><circle class="led" style="animation-delay:${(i*5+j)*.17}s" cx="19" cy="${9.5+j*14}" r="1.8" fill="${c}"/>`).join("")}</g>`).join("")}
     <g transform="translate(190 20)"><path d="M0 0 H90 L58 42 V74 H32 V42 Z" fill="rgba(94,234,212,.08)" stroke="${c}" stroke-width="1.5"/>
     <text x="45" y="-4" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#78716c">KOSPI+KOSDAQ</text>
     <text x="45" y="92" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="${c}">20</text></g>`,
  ana:(c)=>`${desk(150,70,c,130)}${person(150,108,c,"#3a2a1c")}${plant(262,70)}
     <g transform="translate(40 30)"><rect width="46" height="60" rx="4" fill="#d6c0a0"/>${[0,1,2,3].map(j=>`<rect x="5" y="${6+j*13}" width="${30+(j%2)*6}" height="8" rx="1.5" fill="${["#60a5fa","#fb7185","#fcd34d","#86efac"][j]}" opacity=".6"/>`).join("")}</g>`,
  deb:(c)=>`<ellipse cx="160" cy="72" rx="78" ry="34" fill="#e7d5bb" stroke="#d6c0a0"/>
     <ellipse cx="160" cy="72" rx="78" ry="34" fill="url(#shade)" opacity=".4"/>
     ${[0,1,2].map(i=>`<rect x="${128+i*22}" y="60" width="16" height="22" rx="2" fill="#fff" stroke="#d6c0a0" opacity=".95" transform="rotate(${(i-1)*8} ${136+i*22} 71)"/>`).join("")}
     ${person(60,62,"#60a5fa","#1e2a44")}${person(262,62,"#fb7185","#3a1d1d",true)}
     <g class="bubble" id="bb"><rect x="14" y="4" width="92" height="24" rx="12" fill="#60a5fa"/><text x="60" y="20" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">수출지표 반등!</text></g>
     <g class="bubble" id="br"><rect x="202" y="4" width="112" height="24" rx="12" fill="#fb7185"/><text x="258" y="20" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">CB 오버행 확인</text></g>`,
  trd:(c)=>`${desk(160,64,c,170)}<g transform="translate(160 64)"><rect x="-80" y="-20" width="44" height="26" rx="3" fill="#0a0f1e" stroke="#2b3656"/><rect class="screen-glow" x="-78" y="-18" width="40" height="22" rx="2" fill="${c}" opacity=".5"/><rect x="36" y="-20" width="44" height="26" rx="3" fill="#0a0f1e" stroke="#2b3656"/><rect class="screen-glow" x="38" y="-18" width="40" height="22" rx="2" fill="${c}" opacity=".5"/></g>${person(160,104,c,"#1b1530")}`,
  set:(c)=>`<g transform="translate(40 18)"><rect width="170" height="84" rx="8" fill="#fff" stroke="#d6d3d1"/>
     <line x1="12" y1="48" x2="158" y2="48" stroke="#d6d3d1" stroke-dasharray="3 4"/>
     <rect x="40" y="48" width="26" height="12" rx="3" fill="#fb7185"/><text x="53" y="74" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#78716c">wk3</text>
     <rect x="104" y="14" width="26" height="34" rx="3" fill="#34d399"/><text x="117" y="74" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#78716c">wk4</text></g>
     ${person(260,70,c,"#3b2a10")}${plant(300,24)}`,
  ord:(c)=>`<g transform="translate(160 60)" opacity=".8"><rect x="-26" y="-6" width="52" height="40" rx="8" fill="none" stroke="${c}" stroke-width="2"/><path d="M-15 -6 v-10 a15 15 0 0 1 30 0 v10" fill="none" stroke="${c}" stroke-width="2"/><circle cx="0" cy="12" r="4" fill="${c}"/></g>`,
};

/* ---------- 방 정의 (wk4 KR 실제 기록 기반) ---------- */
const ROOMS=[
  {id:"scr",n:1,name:"스크리닝",sub:"Screener · LLM 없음",c:"--c-scr"},
  {id:"ana",n:2,name:"리서치",sub:"Analyst · 20→3",c:"--c-ana"},
  {id:"deb",n:3,name:"토론실",sub:"Bull vs Bear",c:"--c-bull"},
  {id:"ord",n:6,name:"주문 데스크",sub:"Phase C · 미연결",c:"--c-ord",locked:true},
  {id:"set",n:5,name:"복기실",sub:"Settle · 금요일",c:"--c-set"},
  {id:"trd",n:4,name:"트레이더",sub:"Trader · 3→1",c:"--c-trd"},
];
// 봉투 이동 순서: 1 → 2 → 3 → 4(아래 오른쪽) → 5(아래 가운데)
const ORDER=["scr","ana","deb","trd","set"];

const roomsEl=document.getElementById("rooms");
roomsEl.innerHTML=ROOMS.map(r=>`
  <section class="room idle ${r.locked?"locked":""}" id="r-${r.id}" style="--c:var(${r.c})">
    <div class="rh"><span class="num">${r.n}</span><b>${r.name}</b><small>${r.sub}</small><span class="pill" id="p-${r.id}">${r.locked?"예정":"대기"}</span></div>
    <div class="scene"><svg viewBox="0 0 320 130" preserveAspectRatio="xMidYMid meet">${defs}${SC[r.id](getComputedStyle(document.documentElement).getPropertyValue(r.c).trim())}</svg></div>
    <div class="term" id="t-${r.id}"><div class="ln mu">${r.locked?"KIS 계좌 연결 전 · dry-run":"— idle —"}</div></div>
  </section>`).join("");

/* ---------- 복도 경로 ---------- */
const floor=document.querySelector(".floor"), corr=document.getElementById("corr"), env=document.getElementById("env");
function center(id){const a=document.getElementById("r-"+id).getBoundingClientRect(),f=floor.getBoundingClientRect();return[a.left-f.left+a.width/2,a.top-f.top+a.height/2,a,f]}
function drawCorr(){
  const pts=ORDER.map(center);
  corr.setAttribute("viewBox",`0 0 ${floor.clientWidth} ${floor.clientHeight}`);
  const d=pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(0)} ${p[1].toFixed(0)}`).join(" ");
  corr.innerHTML=`<path d="${d}" fill="none" stroke="rgba(120,100,80,.10)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="${d}" fill="none" stroke="rgba(217,119,6,.55)" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round"/>`;
  corr.style.zIndex=0; document.querySelectorAll(".room").forEach(r=>r.style.zIndex=1);
}
function moveEnv(id,count){const[x,y,a,f]=center(id);env.style.left=(x+a.width*.32)+"px";env.style.top=(a.top-f.top+a.height*.3)+"px";document.getElementById("envn").textContent=count}

/* ---------- 사이드 ---------- */
const STEPS=[["scr","Screener","20종목"],["ana","Analyst","273s · 검색 24"],["deb","Bull → Bear","73s / 251s"],["trd","Trader","46s"],["set","Settle","금 15:30"]];
const stepsEl=document.getElementById("steps"), logEl=document.getElementById("log");
function renderSteps(state){stepsEl.innerHTML=STEPS.map(([id,n,m])=>`<div class="st ${state[id]||""}" style="--c:var(${ROOMS.find(r=>r.id===id).c})"><i></i><span>${n}</span><em>${m}</em></div>`).join("")}
function log(t,msg){const d=document.createElement("div");d.innerHTML=`<t>${t}</t>${msg}`;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight}
function term(id,lines,typing){const el=document.getElementById("t-"+id);el.innerHTML=lines.map((l,i)=>`<div class="ln ${i===lines.length-1&&typing?"caret":""}">${l}</div>`).join("");}
function setRoom(id,st){const r=document.getElementById("r-"+id);r.classList.remove("idle","work","done");r.classList.add(st);document.getElementById("p-"+id).textContent={idle:"대기",work:"작업 중",done:"완료"}[st]}

/* ---------- 재생 타임라인 (wk4 KR run_meta·응답 기반, 시간은 압축) ---------- */
const TL=[
 [0,()=>{setRoom("scr","work");moveEnv("scr",20);log("22:01","<span style='color:var(--c-scr)'>screener</span> 기준일 9/18 종가 로드");term("scr",["<span class=mu>$</span> screener --market KR","<span class=mu>universe</span> KOSPI+KOSDAQ","<span class=mu>filter</span> adv20 · mktcap · mom · ret5"],1)}],
 [2200,()=>{setRoom("scr","done");term("scr",["<span class=mu>sort</span> atr20_pct desc","<span class=ok>✓</span> 20 candidates → candidates.csv"]);log("22:01","<span class=ok style='color:#15803d'>✓</span> 후보 20종목 확정")}],
 [3000,()=>{setRoom("ana","work");moveEnv("ana",20);log("23:00","<span style='color:var(--c-ana)'>analyst</span> 시작 · 검색 예산 24");term("ana",["<span class=mu>search</span> 금호건설 최근 공시","<span class=mu>search</span> 파두 catalyst","<span class=mu>search</span> 티에스이 프로브카드"],1)}],
