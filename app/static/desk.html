<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/desk.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head><body>
<div class="app">
  <div class="bar">
    <div class="logo"><i></i>Day Desk</div>
    <nav class="tabs"><a class="on" href="/desk">데스크</a><a href="/">피드백</a></nav>
    <select id="run" class="chip sel" aria-label="주차·시장 선택"></select>
    <span class="chip" id="ver">PROMPT <b>—</b></span>
    <span class="chip" id="mode">—</span>
    <div class="grow"></div>
    <div class="speed" role="group" aria-label="재생 속도">
      <button class="btn sm" data-sp="0.5">0.5×</button><button class="btn sm on" data-sp="1">1×</button><button class="btn sm" data-sp="3">3×</button>
    </div>
    <button class="btn" id="replay">↻ 처음부터</button>
  </div>

  <div class="floor">
    <div class="rooms" id="rooms"></div>
    <svg id="corr"></svg>
    <div class="env" id="env"><svg viewBox="0 0 44 32"><rect x="1" y="1" width="42" height="30" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><path d="M2 3 L22 18 L42 3" fill="none" stroke="#d97706" stroke-width="2"/></svg><span id="envn">—</span></div>
  </div>

  <aside class="side">
    <div class="sec"><h3>Pipeline</h3><div class="steps" id="steps"></div></div>
    <div class="log" id="log"></div>
    <div class="pick" id="pick"></div>
  </aside>
</div>

<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-in">
  <button class="x" id="drawer-x" aria-label="닫기">×</button><div id="drawer-body"></div>
</div></aside>

<script src="/static/desk_scenes.js"></script>
<script src="/static/desk.js"></script>
</body></html>
